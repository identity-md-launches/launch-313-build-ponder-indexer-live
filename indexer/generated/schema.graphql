"""
The `JSON` scalar type represents JSON values as specified by [ECMA-404](http://www.ecma-international.org/publications/files/ECMA-ST/ECMA-404.pdf).
"""
scalar JSON

scalar BigInt

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

type ViewPageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
}

type Meta {
  status: JSON
}

type Query {
  trade(id: String!): trade
  trades(where: tradeFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int, offset: Int): tradePage!
  ticket(id: String!): ticket
  tickets(where: ticketFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int, offset: Int): ticketPage!
  tankFill(id: String!): tankFill
  tankFills(where: tankFillFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int, offset: Int): tankFillPage!
  potSnapshot(id: String!): potSnapshot
  potSnapshots(where: potSnapshotFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int, offset: Int): potSnapshotPage!
  player(address: String!): player
  players(where: playerFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int, offset: Int): playerPage!
  dailyVolume(day: String!): dailyVolume
  dailyVolumes(where: dailyVolumeFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int, offset: Int): dailyVolumePage!
  _meta: Meta
}

